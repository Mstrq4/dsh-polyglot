name: Portable checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    name: Build and portable contracts (not native UI E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Rebuild committed client (no dependency installation)
        run: node scripts/build.mjs
      - name: Check generated artifact is current
        run: git diff --exit-code -- client.js
      - name: Validate JavaScript syntax
        run: |
          node --check index.js
          node --check client.js
          node --check src/native-bridge.js
          node --check src/runtime.js
      - name: Run portable publication, bidi and source contracts
        run: npm run test:portable
